<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hisaab — Voice Ledger</title>
<style>
  :root{
    --paper: #0E2A4A;
    --paper-raised: #163B63;
    --ink: #FFFFFF;
    --ink-soft: #B7CBE3;
    --rule: #2C5C8F;
    --owe: #FF9466;       /* you owe — warm coral, readable on blue */
    --owe-bg: #1F3F63;
    --owed: #6FE3B4;      /* owed to you — mint */
    --owed-bg: #1B3E58;
    --accent: #FFC857;    /* gold, for actions */
    --accent-ink: #17273D;
    font-size: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); }
  body{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    padding-bottom: 96px;
  }
  .serif{ font-family: Georgia, "Times New Roman", serif; }

  header.top{
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    position: sticky; top:0; z-index: 5;
  }
  header.top h1{
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.7rem;
    margin: 0 0 2px;
    letter-spacing: 0.01em;
  }
  header.top .sub{ color: var(--ink-soft); font-size: 0.85rem; }

  .totals{
    display:flex; gap: 12px; padding: 16px 20px 4px;
  }
  .totals .card{
    flex:1; padding: 14px 14px; border-radius: 4px;
    border: 1px solid var(--rule);
  }
  .totals .card.owe{ background: var(--owe-bg); }
  .totals .card.owed{ background: var(--owed-bg); }
  .totals .card .amt{ font-family: Georgia, serif; font-size: 1.5rem; line-height:1.1; }
  .totals .card.owe .amt{ color: var(--owe); }
  .totals .card.owed .amt{ color: var(--owed); }
  .totals .card .lbl{ font-size: 0.75rem; color: var(--ink-soft); margin-top: 4px; }

  main{ padding: 8px 20px 20px; }

  .section-label{
    font-size: 0.78rem; color: var(--ink-soft); margin: 20px 2px 8px;
  }

  .person-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .person-row:active{ background: rgba(0,0,0,0.03); }
  .person-row .name{ font-size: 1.02rem; }
  .person-row .name .last{ display:block; font-size:0.75rem; color:var(--ink-soft); margin-top:2px; }
  .person-row .bal{ font-family: Georgia, serif; font-size: 1.05rem; text-align:right; }
  .person-row .bal.owe{ color: var(--owe); }
  .person-row .bal.owed{ color: var(--owed); }
  .person-row .bal.settled{ color: var(--ink-soft); font-size:0.85rem; }

  .empty{
    padding: 40px 4px; color: var(--ink-soft); font-size: 0.92rem; line-height:1.5;
  }

  /* Bottom command bar */
  .cmdbar{
    position: fixed; bottom:0; left:0; right:0;
    background: var(--paper-raised);
    border-top: 1px solid var(--rule);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap: 8px; align-items:center;
    z-index: 10;
  }
  .cmdbar input[type=text]{
    flex:1; padding: 12px 14px; border-radius: 22px; border: 1px solid var(--rule);
    font-size: 0.95rem; background: var(--paper); color: var(--ink);
  }
  .micbtn, .addbtn{
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-ink);
    font-size: 1.2rem; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer;
  }
  .micbtn.listening{ background: var(--owe); animation: pulse 1.1s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(168,83,46,0.5);} 100%{ box-shadow:0 0 0 14px rgba(168,83,46,0);} }

  /* Modal / overlay */
  .overlay{
    position: fixed; inset:0; background: rgba(5,15,28,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:20;
  }
  .sheet{
    background: var(--paper-raised); width:100%; max-width:520px;
    border-radius: 16px 16px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y:auto;
  }
  .sheet h2{ font-family: Georgia, serif; font-weight:400; font-size:1.3rem; margin:0 0 14px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:0.78rem; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding: 11px 12px; border-radius:8px; border:1px solid var(--rule);
    font-size: 1rem; background: var(--paper); color: var(--ink);
  }
  .btnrow{ display:flex; gap:10px; margin-top: 18px; }
  .btn{
    flex:1; padding: 13px; border-radius: 8px; border:none; font-size:0.95rem;
    cursor:pointer;
  }
  .btn.primary{ background: var(--accent); color: var(--accent-ink); }
  .btn.ghost{ background: transparent; border:1px solid var(--rule); color: var(--ink); }
  .btn.danger{ background: transparent; border:1px solid var(--owe); color: var(--owe); }

  .parsepreview{
    background: var(--paper); border:1px solid var(--rule); border-radius:8px;
    padding: 12px 14px; margin-bottom:14px; font-size:0.9rem; color:var(--ink-soft);
  }
  .parsepreview b{ color: var(--ink); font-weight:600; }

  table.ledger{ width:100%; border-collapse: collapse; margin-top: 8px; font-size: 0.88rem; }
  table.ledger th{ text-align:left; font-weight:500; color:var(--ink-soft); font-size:0.72rem;
    padding: 6px 4px; border-bottom: 1px solid var(--rule); }
  table.ledger td{ padding: 9px 4px; border-bottom: 1px solid var(--rule); vertical-align:top; }
  table.ledger td.num{ text-align:right; font-family: Georgia, serif; }
  table.ledger tr.take td.num.amt-col{ color: var(--owe); }
  table.ledger tr.repay td.num.amt-col{ color: var(--owed); }
  .del-x{ color: var(--ink-soft); font-size:0.85rem; background:none; border:none; cursor:pointer; padding:2px 6px; }

  .backlink{ color: var(--ink-soft); font-size:0.85rem; cursor:pointer; display:inline-block; margin-bottom:10px; }

  .toast{
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 20px;
    font-size: 0.85rem; z-index: 30; opacity:0; pointer-events:none; transition: opacity 0.25s;
  }
  .toast.show{ opacity:1; }

  select#voiceLang{
    background:transparent;border:none;color:var(--ink-soft);font-size:0.72rem; margin-left:6px;
  }
  .langrow{
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 20px 6px;
  }
  .langrow .langpick{
    display:flex; gap:6px;
  }
  .langrow .langpick button{
    border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft);
    padding: 5px 12px; border-radius: 14px; font-size: 0.75rem; cursor:pointer;
  }
  .langrow .langpick button.active{
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .langrow .actions a, .langrow .actions span{
    font-size: 0.78rem; color: var(--ink-soft); cursor:pointer; margin-left: 14px;
  }
</style>
</head>
<body>

<header class="top">
  <h1>Hisaab</h1>
  <div class="sub">say it, and it's on the ledger</div>
</header>

<div class="totals" id="totalsRow"></div>

<div class="langrow">
  <div class="langpick">
    <button id="langEnBtn" class="active">English</button>
    <button id="langTeBtn">తెలుగు</button>
  </div>
  <div class="actions">
    <span id="historyLink">History</span>
    <span id="shareLink">Share</span>
  </div>
</div>

<main id="dashboard"></main>

<div id="personView" style="display:none;"></div>

<div class="cmdbar">
  <button class="micbtn" id="micBtn" title="Voice command">🎤</button>
  <input type="text" id="cmdInput" placeholder='e.g. "I took 2000 from Sulthan"'>
  <button class="addbtn" id="sendBtn" title="Parse command">→</button>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'hisaab_data_v1';
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { people: {} };
}
function saveData(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
let DATA = loadData();

function ensurePerson(name){
  if(!DATA.people[name]) DATA.people[name] = { transactions: [] };
  return DATA.people[name];
}
function addTransaction(name, type, amount, note){
  const p = ensurePerson(name);
  p.transactions.push({
    id: 't' + Date.now() + Math.random().toString(36).slice(2,6),
    type, amount: Number(amount), date: new Date().toISOString(), note: note || ''
  });
  saveData(DATA);
}
function deleteTransaction(name, id){
  const p = DATA.people[name];
  if(!p) return;
  p.transactions = p.transactions.filter(t => t.id !== id);
  saveData(DATA);
}

/* balances: oweThem = took - repaid_them ; owedByThem = gave - repaid_me */
function personBalance(name){
  const p = DATA.people[name];
  if(!p) return {oweThem:0, owedByThem:0, net:0};
  let took=0, gave=0, repaidThem=0, repaidMe=0;
  p.transactions.forEach(t=>{
    if(t.type==='took') took += t.amount;
    else if(t.type==='gave') gave += t.amount;
    else if(t.type==='repaid_them') repaidThem += t.amount;
    else if(t.type==='repaid_me') repaidMe += t.amount;
  });
  const oweThem = took - repaidThem;
  const owedByThem = gave - repaidMe;
  return { oweThem, owedByThem, net: oweThem - owedByThem };
}

function fmt(n){
  const v = Math.round(Math.abs(n));
  return '₹' + v.toLocaleString('en-IN');
}

/* ---------- rendering ---------- */
function renderTotals(){
  let totalOwe=0, totalOwed=0;
  Object.keys(DATA.people).forEach(name=>{
    const b = personBalance(name);
    if(b.net > 0) totalOwe += b.net;
    else if(b.net < 0) totalOwed += -b.net;
  });
  document.getElementById('totalsRow').innerHTML = `
    <div class="card owe"><div class="amt">${fmt(totalOwe)}</div><div class="lbl">you owe</div></div>
    <div class="card owed"><div class="amt">${fmt(totalOwed)}</div><div class="lbl">owed to you</div></div>
  `;
}

function renderDashboard(){
  document.getElementById('personView').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  renderTotals();
  const names = Object.keys(DATA.people).sort((a,b)=>{
    return Math.abs(personBalance(b).net) - Math.abs(personBalance(a).net);
  });
  const dash = document.getElementById('dashboard');
  if(names.length === 0){
    dash.innerHTML = `<div class="empty">No entries yet. Try the mic and say something like<br>"I took 2000 from Sulthan".</div>`;
    return;
  }
  let html = `<div class="section-label">Ledger</div>`;
  names.forEach(name=>{
    const b = personBalance(name);
    const p = DATA.people[name];
    const last = p.transactions[p.transactions.length-1];
    let balHtml;
    if(b.net > 0.001) balHtml = `<div class="bal owe">${fmt(b.net)}<div class="last" style="text-align:right;">you owe</div></div>`;
    else if(b.net < -0.001) balHtml = `<div class="bal owed">${fmt(b.net)}<div class="last" style="text-align:right;">owes you</div></div>`;
    else balHtml = `<div class="bal settled">settled</div>`;
    html += `
      <div class="person-row" data-name="${escapeHtml(name)}">
        <div class="name">${escapeHtml(name)}<span class="last">${p.transactions.length} entr${p.transactions.length===1?'y':'ies'}</span></div>
        ${balHtml}
      </div>`;
  });
  dash.innerHTML = html;
  dash.querySelectorAll('.person-row').forEach(row=>{
    row.addEventListener('click', ()=> renderPerson(row.dataset.name));
  });
}

function typeLabel(type){
  return { took:'Took', gave:'Gave / Lent', repaid_them:'Repaid (by you)', repaid_me:'Repaid (to you)' }[type] || type;
}

function renderPerson(name){
  document.getElementById('dashboard').style.display = 'none';
  const view = document.getElementById('personView');
  view.style.display = 'block';
  const p = DATA.people[name];
  const b = personBalance(name);
  let netLine;
  if(b.net > 0.001) netLine = `<span style="color:var(--owe)">You owe ${escapeHtml(name)} ${fmt(b.net)}</span>`;
  else if(b.net < -0.001) netLine = `<span style="color:var(--owed)">${escapeHtml(name)} owes you ${fmt(b.net)}</span>`;
  else netLine = `<span style="color:var(--ink-soft)">Settled up</span>`;

  const rows = [...p.transactions].sort((a,b2)=> new Date(b2.date)-new Date(a.date)).map(t=>{
    const rowClass = (t.type==='took' || t.type==='repaid_me') ? 'take' : 'repay';
    const sign = (t.type==='took') ? `+${fmt(t.amount)} you owe` :
                 (t.type==='gave') ? `+${fmt(t.amount)} owed to you` :
                 (t.type==='repaid_them') ? `−${fmt(t.amount)} you owe` :
                 `−${fmt(t.amount)} owed to you`;
    const d = new Date(t.date);
    const dateStr = d.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
    return `<tr class="${rowClass}">
      <td>${dateStr}</td>
      <td>${typeLabel(t.type)}</td>
      <td class="num amt-col">${sign}</td>
      <td><button class="del-x" data-id="${t.id}">✕</button></td>
    </tr>`;
  }).join('');

  view.innerHTML = `
    <main style="padding:8px 20px 20px;">
      <div class="backlink" id="backBtn">‹ All ledgers</div>
      <div class="section-label" style="margin-top:0;">${escapeHtml(name)}</div>
      <div style="font-size:1.05rem; margin-bottom:6px;">${netLine}</div>
      <button class="btn ghost" id="manualAddBtn" style="width:auto; padding:8px 16px; font-size:0.85rem; margin-top:6px;">+ Add entry manually</button>
      <table class="ledger">
        <thead><tr><th>Date</th><th>Type</th><th style="text-align:right;">Amount</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="color:var(--ink-soft);">No entries yet</td></tr>'}</tbody>
      </table>
    </main>`;

  document.getElementById('backBtn').addEventListener('click', renderDashboard);
  document.getElementById('manualAddBtn').addEventListener('click', ()=> openManualSheet(name));
  view.querySelectorAll('.del-x').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      deleteTransaction(name, btn.dataset.id);
      renderPerson(name);
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- manual add sheet ---------- */
function openManualSheet(prefillName){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Add entry</h2>
        <div class="field">
          <label>Person</label>
          <input type="text" id="mName" value="${prefillName ? escapeHtml(prefillName) : ''}" placeholder="Name">
        </div>
        <div class="field">
          <label>Type</label>
          <select id="mType">
            <option value="took">I took (I borrowed)</option>
            <option value="gave">I gave (I lent)</option>
            <option value="repaid_them">I repaid them</option>
            <option value="repaid_me">They repaid me</option>
          </select>
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input type="number" id="mAmount" placeholder="0" inputmode="numeric">
        </div>
        <div class="btnrow">
          <button class="btn ghost" id="mCancel">Cancel</button>
          <button class="btn primary" id="mSave">Save</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('mSave').onclick = ()=>{
    const name = document.getElementById('mName').value.trim();
    const type = document.getElementById('mType').value;
    const amount = parseFloat(document.getElementById('mAmount').value);
    if(!name || !amount || amount<=0){ showToast('Enter a name and amount'); return; }
    addTransaction(name, type, amount);
    closeModal();
    renderDashboard();
    renderPerson(name);
    showToast('Saved');
  };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ---------- voice + text command parsing ---------- */
const numberWords = {
  zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10,
  eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17,
  eighteen:18, nineteen:19, twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70,
  eighty:80, ninety:90, hundred:100, thousand:1000, lakh:100000, lac:100000
};
function wordsToNumber(text){
  const tokens = text.toLowerCase().replace(/[,]/g,'').trim().split(/\s+/);
  let total = 0, current = 0; let matched = false;
  for(const tok of tokens){
    if(numberWords.hasOwnProperty(tok)){
      matched = true;
      const val = numberWords[tok];
      if(val === 100){ current = (current || 1) * val; }
      else if(val === 1000 || val === 100000){ current = (current || 1) * val; total += current; current = 0; }
      else{ current += val; }
    }
  }
  total += current;
  return matched ? total : null;
}
function extractAmount(str){
  const digitMatch = str.match(/₹?\s*([\d][\d,]*(?:\.\d+)?)/);
  if(digitMatch) return parseFloat(digitMatch[1].replace(/,/g,''));
  const w = wordsToNumber(str);
  return w;
}
function cleanName(raw){
  if(!raw) return '';
  let n = raw.trim().replace(/[.,!?]+$/,'');
  n = n.replace(/^(mr|mrs|ms|dr)\.?\s+/i,'');
  n = n.split(/\s+/).slice(0,2).join(' '); // keep first-name/short names simple
  return n.replace(/\b\w/g, c=>c.toUpperCase());
}

function parseCommand(raw){
  const text = raw.trim();
  const low = text.toLowerCase();

  let m;
  // I took/borrowed X from Y
  m = low.match(/(?:i\s+)?(?:took|borrowed)\s+(.+?)\s+from\s+([a-z\s]+)/i);
  if(m) return { type:'took', amount: extractAmount(m[1]), name: cleanName(m[2]), raw: text };

  // I gave/lent X to Y
  m = low.match(/(?:i\s+)?(?:gave|lent)\s+(.+?)\s+to\s+([a-z\s]+)/i);
  if(m) return { type:'gave', amount: extractAmount(m[1]), name: cleanName(m[2]), raw: text };

  // I repaid/paid back/returned X to Y
  m = low.match(/(?:i\s+)?(?:repaid|paid\s+back|returned|gave\s+back)\s+(.+?)\s+to\s+([a-z\s]+)/i);
  if(m) return { type:'repaid_them', amount: extractAmount(m[1]), name: cleanName(m[2]), raw: text };

  // Y repaid/paid me back X  OR  received X from Y
  m = low.match(/([a-z\s]+?)\s+(?:repaid|paid\s+back|returned|gave\s+back)\s+(?:me\s+)?(.+)/i);
  if(m) return { type:'repaid_me', amount: extractAmount(m[2]), name: cleanName(m[1]), raw: text };

  m = low.match(/received\s+(.+?)\s+from\s+([a-z\s]+)/i);
  if(m) return { type:'repaid_me', amount: extractAmount(m[1]), name: cleanName(m[2]), raw: text };

  return null;
}

/* ---------- Telugu keyword-based parser (best effort) ----------
   Telugu verbs conjugate by gender/number, so this matches root
   stems as substrings rather than fixed sentence patterns.
   Always relies on the confirm screen to catch mistakes. */
function parseCommandTelugu(raw){
  const text = raw.trim();
  const tokens = text.split(/\s+/);

  // find name: token right before నుండి (from) or కి/కు (to)
  function nameBefore(postpositions){
    for(let i=0;i<tokens.length;i++){
      const tok = tokens[i];
      for(const pp of postpositions){
        if(tok === pp && i>0) return tokens[i-1];
        if(tok.endsWith(pp) && tok.length > pp.length) return tok.slice(0, -pp.length);
      }
    }
    return null;
  }

  const hasFrom = /నుండి/.test(text);
  const hasTo = /(కి|కు)(\s|$)/.test(text) || /(కి|కు)$/.test(text.replace(/\s+$/,''));
  const isBack = /తిరిగి/.test(text);
  const repayVerb = /(కట్ట|తీర్చ|ఇచ్చ)/.test(text) && isBack;
  const takeVerb = /(తీసుకున|అప్పు.*తీసుకున)/.test(text);
  const giveVerb = /ఇచ్చ/.test(text) && !isBack;

  const amount = extractAmount(text);
  let name = nameBefore(['నుండి']) || nameBefore(['కి','కు']);
  name = name ? cleanName(name.replace(/[^\u0C00-\u0C7Fa-zA-Z]/g,' ').trim() || name) : null;
  // if name captured in Telugu script, keep as-is (don't force English capitalization)
  if(name && /[\u0C00-\u0C7F]/.test(name)){
    name = name.trim();
  }

  let type = null;
  if(repayVerb && hasTo) type = 'repaid_them';       // I paid back TO them
  else if(repayVerb && hasFrom) type = 'repaid_me';   // got back FROM them
  else if(takeVerb || (hasFrom && !isBack)) type = 'took';
  else if(giveVerb && hasTo) type = 'gave';
  else if(hasTo) type = 'gave';

  if(!type) return null;
  return { type, amount, name, raw: text };
}

function openConfirmSheet(parsed){
  const root = document.getElementById('modalRoot');
  const typeOptions = ['took','gave','repaid_them','repaid_me'];
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <h2>Confirm entry</h2>
        <div class="parsepreview">Heard: <b>"${escapeHtml(parsed.raw)}"</b></div>
        <div class="field">
          <label>Person</label>
          <input type="text" id="cName" value="${escapeHtml(parsed.name || '')}">
        </div>
        <div class="field">
          <label>Type</label>
          <select id="cType">
            ${typeOptions.map(t=>`<option value="${t}" ${t===parsed.type?'selected':''}>${typeLabel(t)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input type="number" id="cAmount" value="${parsed.amount || ''}" inputmode="numeric">
        </div>
        <div class="btnrow">
          <button class="btn ghost" id="cCancel">Discard</button>
          <button class="btn primary" id="cSave">Save to ledger</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cCancel').onclick = closeModal;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('cSave').onclick = ()=>{
    const name = document.getElementById('cName').value.trim();
    const type = document.getElementById('cType').value;
    const amount = parseFloat(document.getElementById('cAmount').value);
    if(!name || !amount || amount<=0){ showToast('Enter a name and amount'); return; }
    addTransaction(name, type, amount);
    closeModal();
    renderDashboard();
    showToast('Saved to ' + name + "'s ledger");
  };
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

let currentLang = 'en'; // 'en' or 'te'

function handleCommandText(text){
  if(!text.trim()) return;
  const parsed = currentLang === 'te' ? parseCommandTelugu(text) : parseCommand(text);
  if(parsed && parsed.name && parsed.amount){
    openConfirmSheet(parsed);
  } else {
    // couldn't fully parse — open manual add prefilled with whatever we caught, raw text as reference
    showToast("Couldn't quite parse that — fill it in");
    openManualSheet(parsed && parsed.name ? parsed.name : '');
    if(parsed && parsed.amount){
      setTimeout(()=>{ const el=document.getElementById('mAmount'); if(el) el.value = parsed.amount; }, 0);
    }
  }
}

/* ---------- text input wiring ---------- */
document.getElementById('sendBtn').addEventListener('click', ()=>{
  const input = document.getElementById('cmdInput');
  handleCommandText(input.value);
  input.value = '';
});
document.getElementById('cmdInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    handleCommandText(e.target.value);
    e.target.value = '';
  }
});

/* ---------- voice wiring ---------- */
const micBtn = document.getElementById('micBtn');
let recognition = null;
let listening = false;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=>{ listening = true; micBtn.classList.add('listening'); };
  recognition.onend = ()=>{ listening = false; micBtn.classList.remove('listening'); };
  recognition.onerror = (e)=>{
    listening = false; micBtn.classList.remove('listening');
    showToast('Voice error: ' + (e.error || 'try again'));
  };
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    document.getElementById('cmdInput').value = transcript;
    handleCommandText(transcript);
  };

  micBtn.addEventListener('click', ()=>{
    if(listening){ recognition.stop(); return; }
    try{ recognition.start(); }
    catch(err){ showToast('Could not start mic'); }
  });
} else {
  micBtn.addEventListener('click', ()=>{
    showToast('Voice not supported in this browser — type the command instead');
  });
  micBtn.style.opacity = '0.5';
}

/* ---------- language toggle ---------- */
document.getElementById('langEnBtn').addEventListener('click', ()=>{
  currentLang = 'en';
  document.getElementById('langEnBtn').classList.add('active');
  document.getElementById('langTeBtn').classList.remove('active');
  if(recognition) recognition.lang = 'en-IN';
  document.getElementById('cmdInput').placeholder = 'e.g. "I took 2000 from Sulthan"';
});
document.getElementById('langTeBtn').addEventListener('click', ()=>{
  currentLang = 'te';
  document.getElementById('langTeBtn').classList.add('active');
  document.getElementById('langEnBtn').classList.remove('active');
  if(recognition) recognition.lang = 'te-IN';
  document.getElementById('cmdInput').placeholder = 'ఉదా: "సుల్తాన్ నుండి 2000 తీసుకున్నాను"';
});

/* ---------- history (all activity, most recent first) ---------- */
function renderHistory(){
  document.getElementById('personView').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const dash = document.getElementById('dashboard');
  let all = [];
  Object.keys(DATA.people).forEach(name=>{
    DATA.people[name].transactions.forEach(t=> all.push({...t, name}));
  });
  all.sort((a,b)=> new Date(b.date) - new Date(a.date));
  let html = `<div class="backlink" id="backFromHistory">‹ Ledger</div><div class="section-label" style="margin-top:0;">All activity</div>`;
  if(all.length === 0){
    html += `<div class="empty">Nothing recorded yet.</div>`;
  } else {
    html += `<table class="ledger"><thead><tr><th>Date</th><th>Who</th><th>Type</th><th style="text-align:right;">Amount</th></tr></thead><tbody>`;
    all.forEach(t=>{
      const rowClass = (t.type==='took' || t.type==='repaid_me') ? 'take' : 'repay';
      const d = new Date(t.date);
      const dateStr = d.toLocaleDateString('en-IN', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'});
      html += `<tr class="${rowClass}"><td>${dateStr}</td><td>${escapeHtml(t.name)}</td><td>${typeLabel(t.type)}</td><td class="num amt-col">${fmt(t.amount)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  dash.innerHTML = html;
  document.getElementById('backFromHistory').addEventListener('click', renderDashboard);
}
document.getElementById('historyLink').addEventListener('click', renderHistory);

/* ---------- share summary (for son/family to review) ---------- */
function buildShareText(){
  const names = Object.keys(DATA.people).sort((a,b)=> Math.abs(personBalance(b).net) - Math.abs(personBalance(a).net));
  if(names.length === 0) return 'Hisaab ledger — no entries yet.';
  let lines = ['*Hisaab — ledger summary*', ''];
  let totalOwe=0, totalOwed=0;
  names.forEach(name=>{
    const b = personBalance(name);
    if(Math.abs(b.net) < 0.01){ lines.push(`${name}: settled`); return; }
    if(b.net > 0){ lines.push(`${name}: you owe ₹${Math.round(b.net).toLocaleString('en-IN')}`); totalOwe += b.net; }
    else{ lines.push(`${name}: owes you ₹${Math.round(-b.net).toLocaleString('en-IN')}`); totalOwed += -b.net; }
  });
  lines.push('', `Total you owe: ₹${Math.round(totalOwe).toLocaleString('en-IN')}`, `Total owed to you: ₹${Math.round(totalOwed).toLocaleString('en-IN')}`);
  return lines.join('\n');
}
document.getElementById('shareLink').addEventListener('click', ()=>{
  const text = encodeURIComponent(buildShareText());
  window.open('https://wa.me/?text=' + text, '_blank');
});

/* ---------- init ---------- */
renderDashboard();
</script>
